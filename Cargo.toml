[package]
name = "manifold-acoustics"
version = "0.8.1"
edition = "2021"
description = "ACOUSTICS - Mathematical & Physics-Informed Audio Research Engine: exact reversible audio models ranked by complete serialized description length (MDL); pre-dimensionality battery, compositional echo, innovations anatomy"
license = "MIT"
repository = "https://github.com/bageera/acoustics"
readme = "README.md"
keywords = ["audio", "codec", "compression", "lossless"]
categories = ["compression", "multimedia::audio", "science"]

[lib]
name = "acoustics"
path = "src/lib.rs"

[[bin]]
name = "acoustics"
path = "src/main.rs"